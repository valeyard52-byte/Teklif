<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sana Bir Sorum Var! 🌊</title>
    <style>
        /* Deniz Temalı Animasyonlu Arka Plan */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background: linear-gradient(to bottom, #87CEEB, #20B2AA, #008080);
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            text-align: center;
            color: #0d3b66;
        }

        /* Yükselen Baloncuklar Efekti */
        .bubbles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }
        .bubble {
            position: absolute;
            bottom: -50px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            animation: rise 10s infinite ease-in;
        }
        .bubble:nth-child(1) { width: 40px; height: 40px; left: 10%; animation-duration: 8s; }
        .bubble:nth-child(2) { width: 20px; height: 20px; left: 20%; animation-duration: 5s; animation-delay: 1s; }
        .bubble:nth-child(3) { width: 50px; height: 50px; left: 35%; animation-duration: 7s; animation-delay: 2s; }
        .bubble:nth-child(4) { width: 30px; height: 30px; left: 50%; animation-duration: 11s; animation-delay: 0s; }
        .bubble:nth-child(5) { width: 25px; height: 25px; left: 70%; animation-duration: 6s; animation-delay: 3s; }
        .bubble:nth-child(6) { width: 45px; height: 45px; left: 85%; animation-duration: 9s; animation-delay: 1s; }

        @keyframes rise {
            0% { bottom: -50px; transform: translateX(0); opacity: 0; }
            50% { opacity: 1; }
            100% { bottom: 1080px; transform: translateX(-20px); opacity: 0; }
        }

        /* Cam Efektli (Glassmorphism) Kutu */
        .container {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            border: 2px solid rgba(255, 255, 255, 0.5);
            max-width: 450px;
            width: 85%;
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #48cae4;
            margin-bottom: 20px;
        }

        h1 { font-size: 24px; color: #023e8a; text-shadow: 1px 1px 2px rgba(255,255,255,0.8); }
        p { font-size: 16px; color: #0077b6; font-weight: bold; }

        .buttons {
            margin-top: 25px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        button {
            padding: 12px 25px;
            font-size: 16px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        #yesBtn, .actionBtn {
            background: linear-gradient(45deg, #00b4d8, #0077b6);
            color: white;
            z-index: 10;
        }
        
        #yesBtn:hover, .actionBtn:hover { 
            transform: scale(1.05) translateY(-3px); 
            box-shadow: 0 8px 20px rgba(0, 119, 182, 0.4);
        }

        #noBtn {
            background-color: #caf0f8;
            color: #03045e;
            transition: left 0.2s ease, top 0.2s ease;
        }

        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 25px;
        }

        .actionBtn {
            padding: 15px 10px;
            font-size: 14px;
            border-radius: 15px;
        }

        #page2, #page3, #page4 { display: none; }

        input[type="date"] {
            padding: 12px;
            font-size: 16px;
            border: 2px solid #00b4d8;
            border-radius: 15px;
            margin: 20px 0;
            width: 80%;
            outline: none;
            color: #023e8a;
            background-color: #f0f8ff;
        }
    </style>
</head>
<body>

    <div class="bubbles">
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
    </div>

    <div class="container" id="page1">
        <img src="foto.jpg" alt="Fotoğraf">
        <h1>Benimle date'e çıkar mısın? 🐬</h1>
        <div class="buttons">
            <button id="yesBtn" onclick="showPage(2)">EVET 💙</button>
            <button id="noBtn">HAYIR</button>
        </div>
    </div>

    <div class="container" id="page2">
        <h1>Harika! 🌊</h1>
        <p>Hangi gün müsaitsin?</p>
        <input type="date" id="datePicker">
        <br>
        <button id="yesBtn" onclick="checkDate()">Devam Et 🐚</button>
    </div>

    <div class="container" id="page3">
        <h1>Süper! 🐠</h1>
        <p>Peki günümüzü nasıl geçirelim?</p>
        <div class="action-grid">
            <button class="actionBtn" onclick="sendData('Deniz Kenarında Kahve ☕🌊')">Deniz Kenarında Kahve ☕🌊</button>
            <button class="actionBtn" onclick="sendData('İskelede Gün Batımı 🌅')">İskelede Gün Batımı 🌅</button>
            <button class="actionBtn" onclick="sendData('Beraber İşaret Dili (TİD) Pratiği 🤟✨')">Beraber İşaret Dili Pratiği 🤟✨</button>
            <button class="actionBtn" onclick="sendData('Kumsalda Kutu Oyunu 🎲🦀')">Kumsalda Kutu Oyunu 🎲🦀</button>
            <button class="actionBtn" onclick="sendData('Sahilde Yürüyüş ve Dondurma 🍦💙')">Sahilde Yürüyüş & Dondurma 🍦💙</button>
            <button class="actionBtn" onclick="sendData('Sürprizi Sen Yap! 🏖️')">Sürprizi Sen Yap! 🏖️</button>
        </div>
    </div>

    <div class="container" id="page4">
        <h1>Anlaştık! 🥰</h1>
        <p>Seçimlerini kaydettim, o gün için sabırsızlanıyorum! 🌊💙</p>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');

        const moveButton = () => {
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - 20);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - 20);
            noBtn.style.position = 'fixed';
            noBtn.style.left = `${Math.abs(x)}px`;
            noBtn.style.top = `${Math.abs(y)}px`;
        };

        noBtn.addEventListener('mouseover', moveButton);
        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault(); 
            moveButton();
        });

        function showPage(pageNumber) {
            document.getElementById('page1').style.display = 'none';
            document.getElementById('page2').style.display = 'none';
            document.getElementById('page3').style.display = 'none';
            document.getElementById('page4').style.display = 'none';
            document.getElementById(`page${pageNumber}`).style.display = 'block';
        }

        function checkDate() {
            const date = document.getElementById('datePicker').value;
            if(!date) {
                alert("Lütfen önce bir tarih seç! 💙");
                return;
            }
            showPage(3);
        }

        function sendData(activity) {
            const date = document.getElementById('datePicker').value;
            
            // LİNKİNİ BURAYA YAPIŞTIR (Tırnakları silmeden!)
            const formspreeLink = "BURAYA_LINKI_YAPISTIR"; 
            
            showPage(4);

            fetch(formspreeLink, {
                method: 'POST',
                headers: {
                    'Accept': 'application/json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    "Tarih": date,
                    "Secilen_Aktivite": activity
                })
            }).then(response => {
                console.log("Gönderildi!");
            }).catch(error => {
                console.log("Hata oluştu.");
            });
        }
    </script>
</body>
</html>
